title: About Me
description: Full-Stack Software Engineer in Cairo, Egypt — building production web apps, ERP platforms, and microservices end to end.
content: |
  Hi, I'm **Mohamed Eslam**, a Full-Stack Software Engineer based in Cairo, Egypt. I started on the frontend and now ship end to end: React/Next.js and Vue/Nuxt interfaces, Laravel and FastAPI backends, background queues, signed webhooks, and the infrastructure that runs them.

  I work at **Velents.ai**, where I build AI voice-agent and document products — Agent Hub, Safha Archive, Safha AI, and a villa feasibility system — plus standalone microservices: a multi-tenant OCR extraction service, a PostGIS roads service, and an AI scraping engine. I also build the Automation Hub Playwright test-orchestration platform and the company-wide E2E suites.

  ### How I Work

  - Ship production features end to end, from database schema and API contracts to the UI.
  - Keep clear module boundaries, typed data, and automated tests.
  - Use AI-assisted development (Claude Code) to shorten the path from idea to production — without skipping review.
  - Care about performance, accessibility, and the developer experience of the next person reading the code.

  ### Experience

  - **Full-Stack Engineer · Velents.ai** _(01/2026 – Present)_ — Agent Hub, Safha Archive, Safha AI, feasibility-study system, OCR/geospatial/scraping microservices, Automation Hub, GitOps.
  - **Front-End Engineer · Amar Benaa** _(04/2025 – Present, part-time)_ — ERP frontend solutions for digital transformation.
  - **Software Engineer · ATW** _(07/2024 – 01/2026)_ — mobile-first Nuxt.js/Vue 3 interfaces, performance and cross-browser work.

  ### Education

  **B.S. Computers and Artificial Intelligence** — Cairo University, Cairo, Egypt _(09/2019 – 09/2023)_

  ### Languages

  Arabic (Native) · English (Intermediate)

  ### Open Source

  - **@eslamdevui/ui** — accessible, performant UI component library for Vue & Nuxt built on Tailwind CSS.
  - **@eslamdevui/vue** — unstyled, accessible Vue 3 components for Tailwind CSS.
  - **vue-directives-kit** — reusable Vue directives that remove repetitive DOM code.
  - **vercel/next.js #93757** — reported an image-optimization cache bug with root-cause analysis across three source files and four suggested fixes.

  ### Beyond Code

  Outside of work I explore UI/UX design, cybersecurity, and AI-assisted development, and I contribute to open source. I value teamwork, adaptability, and continuous improvement. Thanks for visiting — browse my [projects](/projects), [download my CV (PDF)](/MohamedEslamCV.pdf), or [get in touch](/#contact) if you'd like to collaborate.

