faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my skills, services, and experience.
  categories:
    - title: Skills & Services
      questions:
        - label: What technologies do you specialize in?
          content: |
            I work across the stack: Next.js, React, Vue 3 and Nuxt on the frontend; Laravel, NestJS, FastAPI and Node.js on the backend; PostgreSQL, Redis, PostGIS and Typesense for data; and Docker, CI/CD, ArgoCD/Helm and Playwright for delivery. I also build and publish reusable npm packages.
        - label: What services do you offer?
          content: |
            I build production web applications and internal platforms end to end — frontend architecture and design systems, REST APIs, background jobs and queues, webhooks, and automated test suites. I can join an existing product team or own a feature from schema to UI.
        - label: Do you contribute to open-source?
          content: |
            Yes. I maintain and publish npm packages — @eslamdevui/ui, @eslamdevui/vue and vue-directives-kit — and I have reported bugs upstream, including a Next.js image-optimization cache issue with a full root-cause analysis.
    - title: Projects & Collaboration
      questions:
        - label: Can you work with remote teams?
          content: |
            Absolutely. I currently work remotely with a team in Riyadh while based in Cairo, using GitHub, CI/CD, and async communication. I'm comfortable across time zones and distributed code review.
        - label: How do you approach new projects?
          content: |
            I start by understanding the requirements and the data model, then design module boundaries and typed contracts before building. I focus on performance, accessibility, and maintainability from the start, and I ship in small, reviewable increments with tests.
        - label: How do you use AI in your workflow?
          content: |
            I use AI-assisted development (Claude Code) to accelerate scaffolding, refactors, and backend implementation, backed by code review and tests. At Velents I authored the internal Claude Code skills catalog that the team uses day to day.
    - title: About Me
      questions:
        - label: What motivates you as a developer?
          content: |
            I enjoy solving complex problems across the stack, learning new technologies, and contributing to the open-source community. Building tools that other developers rely on is especially rewarding.
        - label: What are your interests outside of coding?
          content: |
            Outside of development, I enjoy UI/UX design, cybersecurity, exploring new technologies, and participating in tech meetups in Cairo.
