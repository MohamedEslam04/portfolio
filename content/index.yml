about:
  title: "About Me"
  description: >-
    I'm a Full-Stack Software Engineer with a strong frontend background, based in Cairo, Egypt.
    I ship production features across AI voice agents, document-management ERPs, and geospatial tools
    using Next.js, React, Vue/Nuxt, Laravel, NestJS, and FastAPI. I care about clean architecture,
    performance, and developer experience — and I use AI-assisted workflows to move from idea to
    shipped feature faster.
